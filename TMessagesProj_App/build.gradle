apply plugin: 'com.android.application'

// Load local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

// Make properties available as variables
ext.RELEASE_KEYSTORE_PATH = localProperties.getProperty('RELEASE_KEYSTORE_PATH', System.getenv('RELEASE_KEYSTORE_PATH') ?: '../TMessagesProj/config/release.keystore')
ext.RELEASE_KEY_PASSWORD = localProperties.getProperty('RELEASE_KEY_PASSWORD', System.getenv('RELEASE_KEY_PASSWORD') ?: 'android')
ext.RELEASE_KEY_ALIAS = localProperties.getProperty('RELEASE_KEY_ALIAS', System.getenv('RELEASE_KEY_ALIAS') ?: 'androidkey')
ext.RELEASE_STORE_PASSWORD = localProperties.getProperty('RELEASE_STORE_PASSWORD', System.getenv('RELEASE_STORE_PASSWORD') ?: 'android')
ext.RESOLVED_APP_VERSION_CODE = System.getenv('RELEASE_VERSION_CODE') ?: APP_VERSION_CODE
ext.RESOLVED_APP_VERSION_NAME = System.getenv('RELEASE_VERSION_NAME') ?: APP_VERSION_NAME
ext.GOOGLE_MAPS_API_KEY = localProperties.getProperty('google.maps.api.key', System.getenv('GOOGLE_MAPS_API_KEY') ?: '')

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE
    defaultConfig.manifestPlaceholders = [
            googleMapsApiKey: GOOGLE_MAPS_API_KEY ? GOOGLE_MAPS_API_KEY : '@string/google_api_key'
    ]

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file(RELEASE_KEYSTORE_PATH)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            storeFile file(RELEASE_KEYSTORE_PATH)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(RESOLVED_APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionName RESOLVED_APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

tasks.register("printAfatReleaseMetadata") {
    doLast {
        def variant = android.applicationVariants.find { it.name == "afatRelease" }
        if (variant == null) {
            throw new GradleException("afatRelease variant not found")
        }

        def output = variant.outputs.first()
        def baseVersionCode = variant.mergedFlavor.versionCode
        def playVersionCode = output.versionCodeOverride ?: baseVersionCode

        println "RELEASE_VERSION_NAME=${variant.versionName}"
        println "RELEASE_VERSION_CODE=${baseVersionCode}"
        println "PLAY_RELEASE_VERSION_CODE=${playVersionCode}"
    }
}

// --- Generate google-services.json ---
task generateGoogleServices {
    def outputFile = file("google-services.json")

    outputs.file outputFile
    outputs.upToDateWhen { false }

    doLast {
        def content = null
        def source = null

        // Try base64-encoded env var (CI)
        def envJson = System.getenv('GOOGLE_SERVICES_JSON')
        if (envJson != null && !envJson.isEmpty()) {
            content = new String(Base64.decoder.decode(envJson))
            source = "GOOGLE_SERVICES_JSON env var"
        }

        // Try path from local.properties
        if (content == null) {
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                def jsonPath = props.getProperty('google.services.json.path')
                if (jsonPath != null && !jsonPath.isEmpty()) {
                    def jsonFile = file(jsonPath)
                    if (jsonFile.exists()) {
                        content = jsonFile.text
                        source = "local.properties path"
                    }
                }
            }
        }

        if (content != null) {
            if (!outputFile.exists() || outputFile.text != content) {
                outputFile.text = content
            }
            logger.lifecycle("Generated google-services.json from ${source}")
            return
        }

        if (outputFile.exists()) {
            def existing = outputFile.text
            if (!existing.contains("dummy-api-key") && !existing.contains("dummy-project-id")) {
                logger.lifecycle("Using existing google-services.json")
                return
            }
        }

        def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.US).contains("release") }
        if (isReleaseBuild) {
            throw new GradleException("Real google-services.json is required for release builds. Set GOOGLE_SERVICES_JSON or google.services.json.path.")
        }

        // Fallback: dummy config so the build compiles
        if (content == null) {
            content = '''{
  "project_info": {
    "project_number": "000000000000",
    "project_id": "dummy-project-id",
    "storage_bucket": "dummy-project-id.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
        "android_client_info": {
          "package_name": "''' + APP_PACKAGE + '''"
        }
      },
      "api_key": [
        {
          "current_key": "dummy-api-key"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    },
    {
      "client_info": {
        "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
        "android_client_info": {
          "package_name": "''' + APP_PACKAGE + '''.beta"
        }
      },
      "api_key": [
        {
          "current_key": "dummy-api-key"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}'''
            logger.lifecycle("Generated dummy google-services.json (Firebase features will not work)")
        }

        outputFile.text = content
    }
}

// Hook generateGoogleServices before Google Services plugin processes it
afterEvaluate {
    tasks.matching { it.name.startsWith('process') && it.name.endsWith('GoogleServices') }.configureEach {
        dependsOn generateGoogleServices
    }
}
apply plugin: 'com.google.gms.google-services'
