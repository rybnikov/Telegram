name: Android Internal Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v12.5.9)"
        required: true
        type: string
      promote_release:
        description: "Attempt automatic Google Play promote after upload"
        required: true
        default: true
        type: boolean

concurrency:
  group: android-internal-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    if: ${{ github.actor == 'rybnikov' && github.ref == 'refs/heads/foldogram' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: play-internal
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      TELEGRAM_PLAYSTORE_URL: ${{ secrets.TELEGRAM_PLAYSTORE_URL }}
      TELEGRAM_HUAWEI_APP_ID: ${{ secrets.TELEGRAM_HUAWEI_APP_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set release paths
        shell: bash
        run: |
          echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESSLEVEL=6" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> "$GITHUB_ENV"
          echo "ANDROID_CCACHE=ccache" >> "$GITHUB_ENV"

      - name: Resolve release version from input tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ inputs.release_tag }}"
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must match vX.Y.Z, got: $TAG_NAME" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/foldogram" ]]; then
            echo "Internal release workflow must run from refs/heads/foldogram, got: ${GITHUB_REF}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "Release tag already exists on origin: ${TAG_NAME}" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE="$((MAJOR * 1000000 + MINOR * 1000 + PATCH))"

          BASELINE_VERSION_NAME="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          BASELINE_VERSION_CODE="$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)"
          if [[ -n "$BASELINE_VERSION_NAME" ]]; then
            if [[ "$(printf '%s\n%s\n' "$BASELINE_VERSION_NAME" "$VERSION_NAME" | sort -V | tail -n 1)" != "$VERSION_NAME" || "$BASELINE_VERSION_NAME" == "$VERSION_NAME" ]]; then
              echo "Release version must be higher than baseline version ${BASELINE_VERSION_NAME} from gradle.properties" >&2
              exit 1
            fi
          fi
          if [[ -n "$BASELINE_VERSION_CODE" && "$VERSION_CODE" -le "$BASELINE_VERSION_CODE" ]]; then
            echo "Release versionCode must be higher than baseline versionCode ${BASELINE_VERSION_CODE} from gradle.properties" >&2
            exit 1
          fi

          PREVIOUS_TAG="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG_NAME" | sort -V | tail -n 1 || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
            if [[ "$(printf '%s\n%s\n' "$PREVIOUS_VERSION" "$VERSION_NAME" | sort -V | tail -n 1)" != "$VERSION_NAME" || "$PREVIOUS_VERSION" == "$VERSION_NAME" ]]; then
              echo "Release version must be higher than previous tag ${PREVIOUS_TAG}" >&2
              exit 1
            fi
          fi

          echo "RELEASE_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "Resolved release ${VERSION_NAME} (${VERSION_CODE}) from ${TAG_NAME}"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;27.2.12479018"

      - name: Install ccache
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version
          which ccache

      - name: Restore native ccache state
        id: restore-native-ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ndk-ccache-r27c-afatRelease-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'TMessagesProj/jni/**/CMakeLists.txt', 'TMessagesProj/jni/**/*.cmake', 'TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.cc', 'TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.cxx', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/jni/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-ndk-ccache-r27c-afatRelease-

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Resolve Play release metadata from Gradle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -q :TMessagesProj_App:printAfatReleaseMetadata > "$RUNNER_TEMP/release-metadata.env"
          grep -E '^(RELEASE_VERSION_NAME|RELEASE_VERSION_CODE|PLAY_RELEASE_VERSION_CODE)=' "$RUNNER_TEMP/release-metadata.env" >> "$GITHUB_ENV"
          test -n "$(grep '^PLAY_RELEASE_VERSION_CODE=' "$RUNNER_TEMP/release-metadata.env" | cut -d= -f2)"

      - name: Validate required secrets
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$TELEGRAM_APP_ID"
          test -n "$TELEGRAM_APP_HASH"
          test -n "$GOOGLE_SERVICES_JSON"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          test -n "$RELEASE_VERSION_NAME"
          test -n "$RELEASE_VERSION_CODE"
          test -n "$PLAY_RELEASE_VERSION_CODE"

      - name: Reset ccache stats
        shell: bash
        run: |
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|max_size|base_dir|compiler_check' || true
          ccache -s

      - name: Build release bundle
        id: build-release-bundle
        run: ./gradlew :TMessagesProj_App:bundleAfatRelease

      - name: Show ccache stats
        if: ${{ !cancelled() }}
        shell: bash
        run: ccache -s

      - name: Save native ccache state
        if: ${{ !cancelled() && steps.build-release-bundle.outcome == 'success' && steps.restore-native-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-native-ccache.outputs.cache-primary-key }}

      - name: Generate release checksums
        shell: bash
        run: |
          sha256sum TMessagesProj_App/build/outputs/bundle/afatRelease/TMessagesProj_App-afat-release.aab > "foldogram-${RELEASE_VERSION_NAME}-checksums.txt"

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Foldogram-${{ env.RELEASE_VERSION_NAME }}-checksums
          path: foldogram-${{ env.RELEASE_VERSION_NAME }}-checksums.txt
          if-no-files-found: error

      - name: Upload to Google Play internal
        uses: r0adkll/upload-google-play@0250910c30c1c098744c510e32e1659c6af78eb6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rbnkv.foldogram
          releaseFiles: TMessagesProj_App/build/outputs/bundle/afatRelease/TMessagesProj_App-afat-release.aab
          track: internal
          status: draft

      - name: Promote Google Play internal release
        id: promote-google-play
        if: ${{ inputs.promote_release }}
        continue-on-error: true
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          classify_play_error() {
            python3 - "$1" "$2" <<'PY'
          import json
          import sys

          http_code = sys.argv[1]
          path = sys.argv[2]

          try:
              with open(path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception:
              print("other")
              raise SystemExit(0)

          error = data.get("error") or {}
          message = (error.get("message") or "").lower()
          status = error.get("status") or ""
          code = str(error.get("code") or "")

          if (
              http_code == "400"
              and code == "400"
              and status == "INVALID_ARGUMENT"
              and "only releases with status draft may be created on draft app" in message
          ):
              print("draft_app")
          else:
              print("other")
          PY
          }

          SA_JSON_PATH="${RUNNER_TEMP}/play-service-account.json"
          SA_KEY_PATH="${RUNNER_TEMP}/play-service-account.pem"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$SA_JSON_PATH"

          CLIENT_EMAIL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["client_email"])' "$SA_JSON_PATH")"
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["private_key"])' "$SA_JSON_PATH" > "$SA_KEY_PATH"

          JWT_ASSERTION="$(
            python3 -c 'import base64,json,sys,time; b=lambda d: base64.urlsafe_b64encode(d).rstrip(b"=").decode(); now=int(time.time()); header={"alg":"RS256","typ":"JWT"}; claim={"iss":sys.argv[1],"scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":now,"exp":now+3600}; print("{}.{}".format(b(json.dumps(header, separators=(",", ":")).encode()), b(json.dumps(claim, separators=(",", ":")).encode())))' "$CLIENT_EMAIL"
          )"

          JWT_SIGNATURE="$(printf '%s' "$JWT_ASSERTION" | openssl dgst -sha256 -sign "$SA_KEY_PATH" -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          ACCESS_TOKEN="$(
            curl -fsS https://oauth2.googleapis.com/token \
              -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
              --data-urlencode assertion="${JWT_ASSERTION}.${JWT_SIGNATURE}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          )"

          EDIT_ID="$(
            curl -fsS -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.rbnkv.foldogram/edits" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
          )"

          TRACK_PAYLOAD="$(
            python3 -c 'import json,os; print(json.dumps({"track":"internal","releases":[{"name":os.environ["RELEASE_VERSION_NAME"],"versionCodes":[os.environ["PLAY_RELEASE_VERSION_CODE"]],"status":"completed"}]}, separators=(",", ":")))' 
          )"

          TRACK_URL="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.rbnkv.foldogram/edits/${EDIT_ID}/tracks/internal"
          COMMIT_URL="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.rbnkv.foldogram/edits/${EDIT_ID}:commit"
          TRACK_RESPONSE_PATH="${RUNNER_TEMP}/play-track-response.json"
          COMMIT_RESPONSE_PATH="${RUNNER_TEMP}/play-commit-response.json"

          attempt=1
          max_attempts=10
          while true; do
            http_code="$(
              curl -sS -o "$TRACK_RESPONSE_PATH" -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json; charset=utf-8" \
                -d "$TRACK_PAYLOAD" \
                "$TRACK_URL"
            )"

            if [[ "$http_code" =~ ^2 ]]; then
              break
            fi

            if [[ ( "$http_code" == "404" || "$http_code" == "409" ) && "$attempt" -lt "$max_attempts" ]]; then
              echo "Track promote attempt ${attempt}/${max_attempts} returned HTTP ${http_code}; waiting for Play to expose uploaded version ${PLAY_RELEASE_VERSION_CODE} before retrying."
              cat "$TRACK_RESPONSE_PATH" || true
              sleep 30
              attempt=$((attempt + 1))
              continue
            fi

            if [[ "$(classify_play_error "$http_code" "$TRACK_RESPONSE_PATH")" == "draft_app" ]]; then
              echo "result=draft_app" >> "$GITHUB_OUTPUT"
              echo "Play rejected completed promote because the app is still draft. Upload succeeded; leaving release as draft."
              cat "$TRACK_RESPONSE_PATH" || true
              exit 0
            fi

            echo "Track promote failed with HTTP ${http_code}"
            cat "$TRACK_RESPONSE_PATH" || true
            exit 1
          done

          commit_http_code="$(
            curl -sS -o "$COMMIT_RESPONSE_PATH" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "$COMMIT_URL"
          )"

          if [[ ! "$commit_http_code" =~ ^2 ]]; then
            if [[ "$(classify_play_error "$commit_http_code" "$COMMIT_RESPONSE_PATH")" == "draft_app" ]]; then
              echo "result=draft_app" >> "$GITHUB_OUTPUT"
              echo "Play rejected completed promote during edit commit because the app is still draft. Upload succeeded; leaving release as draft."
              cat "$COMMIT_RESPONSE_PATH" || true
              exit 0
            fi

            echo "Edit commit failed with HTTP ${commit_http_code}"
            cat "$COMMIT_RESPONSE_PATH" || true
            exit 1
          fi

          echo "result=completed" >> "$GITHUB_OUTPUT"

      - name: Report Play promote result
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ inputs.promote_release }}" != "true" ]]; then
            echo "Automatic Play promote skipped by workflow input."
            exit 0
          fi

          if [[ "${{ steps.promote-google-play.outputs.result }}" == "completed" ]]; then
            echo "Automatic Play promote succeeded."
            exit 0
          fi

          if [[ "${{ steps.promote-google-play.outputs.result }}" == "draft_app" ]]; then
            echo "Upload succeeded, but Google Play still treats this app as draft. The internal release remains draft and must follow the manual first-publish/review path."
            exit 0
          fi

          echo "Automatic Play promote failed; continuing so the release can be completed and promoted manually later."

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "Release tag already exists on origin: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Internal release ${RELEASE_TAG}" "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CHECKSUM_FILE="foldogram-${RELEASE_VERSION_NAME}-checksums.txt"
          RELEASE_NOTES_FILE="${RUNNER_TEMP}/github-release-notes.md"

          cat > "$RELEASE_NOTES_FILE" <<EOF
          Internal release for ${RELEASE_VERSION_NAME}.

          Play versionCode: ${PLAY_RELEASE_VERSION_CODE}

          Attached asset:
          - SHA-256 checksums
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$CHECKSUM_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$CHECKSUM_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE" \
              --prerelease
          fi
