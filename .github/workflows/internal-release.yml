name: Android Internal Release

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload the built AAB to Google Play internal testing
        required: true
        type: boolean
        default: true

concurrency:
  group: android-internal-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      TELEGRAM_PLAYSTORE_URL: ${{ secrets.TELEGRAM_PLAYSTORE_URL }}
      TELEGRAM_HUAWEI_APP_ID: ${{ secrets.TELEGRAM_HUAWEI_APP_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;21.4.7075529"

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_APP_ID"
          test -n "$TELEGRAM_APP_HASH"
          test -n "$GOOGLE_SERVICES_JSON"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_STORE_PASSWORD"

      - name: Build release bundle
        run: ./gradlew :TMessagesProj_App:bundleAfatRelease

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foldogram-aab
          path: TMessagesProj_App/build/outputs/bundle/afatRelease/TMessagesProj_App-afat-release.aab
          if-no-files-found: error

      - name: Upload to Google Play internal
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rbnkv.foldogram
          releaseFiles: TMessagesProj_App/build/outputs/bundle/afatRelease/TMessagesProj_App-afat-release.aab
          track: internal
          status: completed
