<!DOCTYPE html>
<html>
    <head>
        <style>
            body { margin: 0; width:100%%; height:100%%;  background-color:#000; }
            html { width:100%%; height:100%%; background-color:#000; }
            .embed-container iframe,
            .embed-container object,
               .embed-container embed {
                   position: absolute;
                   top: 0;
                   left: 0;
                   width: 100%% !important;
                   height: 100%% !important;
               }
        </style>
    </head>
    <body>
        <div class="embed-container">
            <div id="player"></div>
        </div>
        <script src="https://www.youtube.com/iframe_api"></script>
        <script>
               var player;
               var posted = false;
               var captionsApiReady = false;
               var captionTracklist = [];
               var pendingCaptionEnable = false;
               var pendingCaptionLanguageCode = null;
               YT.ready(function() {
                   player = new YT.Player("player", {
                                          "width": "100%%",
                                          "events": {
                                              "onReady": "onReady",
                                              "onError": "onError",
                                              "onStateChange": "onStateChange",
                                              "onApiChange": "onApiChange",
                                          },
                                          "videoId": "%1$s",
                                          "height": "100%%",
                                          "playerVars": {
                                              "start": %2$d,
                                              "rel": 1,
                                              "showinfo": 0,
                                              "modestbranding": 0,
                                              "iv_load_policy": 3,
                                              "autohide": 1,
                                              "autoplay": 1,
                                              "cc_load_policy": %3$d,
                                              "cc_lang_pref": %4$s,
                                              "playsinline": 1,
                                              "controls": 0
                                          }
                                      });
                   player.setSize(window.innerWidth, window.innerHeight);
               });
               function onError(event) {
                   if (window.YoutubeProxy !== undefined) {
                       YoutubeProxy.onPlayerError(event.data);
                   }
                   if (!posted) {
                       if (window.YoutubeProxy !== undefined) {
                           YoutubeProxy.onPlayerLoaded();
                       }
                       posted = true;
                   }
               }
               function onStateChange(event) {
                   if (event.data == YT.PlayerState.PLAYING && !posted) {
                       if (window.YoutubeProxy !== undefined) {
                           YoutubeProxy.onPlayerLoaded();
                       }
                       posted = true;
                   }
                   if (window.YoutubeProxy !== undefined) {
                       YoutubeProxy.onPlayerStateChange(event.data);
                   }
               }
               function onReady(event) {
                   playVideo();

                   if (window.YoutubeProxy !== undefined) {
                       YoutubeProxy.onPlayerNotifyDuration(player.getDuration());
                   }
               }
               function playVideo() {
                   player.playVideo();
               }
               function pauseVideo() {
                   player.pauseVideo();
               }
               function seekTo(time, seekAhead) {
                   player.seekTo(time, seekAhead);
               }
               function setPlaybackSpeed(speed) {
                   player.setPlaybackRate(speed);
               }
               function normalizeLanguageCode(languageCode) {
                   return typeof languageCode === "string" ? languageCode.replace(/_/g, "-").toLowerCase() : "";
               }
               function getTrackLanguageCode(track) {
                   if (!track || typeof track !== "object") {
                       return null;
                   }
                   return track.languageCode || track.language_code || null;
               }
               function getCaptionTracklist() {
                   try {
                       var tracks = player.getOption("captions", "tracklist");
                       return Array.isArray(tracks) ? tracks : [];
                   } catch (e) {
                       return [];
                   }
               }
               function resolveCaptionLanguageCode(preferredLanguageCode) {
                   var normalizedPreferredLanguageCode = normalizeLanguageCode(preferredLanguageCode);
                   if (captionTracklist.length > 0) {
                       if (normalizedPreferredLanguageCode) {
                           for (var i = 0; i < captionTracklist.length; ++i) {
                               var exactTrackLanguageCode = getTrackLanguageCode(captionTracklist[i]);
                               if (normalizeLanguageCode(exactTrackLanguageCode) === normalizedPreferredLanguageCode) {
                                   return exactTrackLanguageCode;
                               }
                           }
                           var preferredLanguageBase = normalizedPreferredLanguageCode.split("-")[0];
                           for (var j = 0; j < captionTracklist.length; ++j) {
                               var baseTrackLanguageCode = getTrackLanguageCode(captionTracklist[j]);
                               if (normalizeLanguageCode(baseTrackLanguageCode).split("-")[0] === preferredLanguageBase) {
                                   return baseTrackLanguageCode;
                               }
                           }
                       }
                       return getTrackLanguageCode(captionTracklist[0]);
                   }
                   return preferredLanguageCode || null;
               }
               function notifyCaptionsState() {
                   if (window.YoutubeProxy === undefined) {
                       return;
                   }
                   var firstTrackLanguageCode = captionTracklist.length > 0 ? getTrackLanguageCode(captionTracklist[0]) : "";
                   YoutubeProxy.onSubtitlesApiChanged(captionsApiReady, firstTrackLanguageCode || "");
               }
               function applyPendingCaptions() {
                   if (!captionsApiReady || !pendingCaptionEnable) {
                       return false;
                   }
                   try {
                       player.loadModule("captions");
                       var resolvedLanguageCode = resolveCaptionLanguageCode(pendingCaptionLanguageCode);
                       if (resolvedLanguageCode) {
                           player.setOption("captions", "track", {"languageCode": resolvedLanguageCode});
                       } else {
                           player.setOption("captions", "reload", true);
                       }
                       pendingCaptionEnable = false;
                       return true;
                   } catch(e) {
                       try {
                           player.setOption("captions", "reload", true);
                           pendingCaptionEnable = false;
                           return true;
                       } catch (ignored) {}
                   }
                   return false;
               }
               function onApiChange(event) {
                   try {
                       var options = player.getOptions();
                       captionsApiReady = Array.isArray(options) && options.indexOf("captions") >= 0;
                       captionTracklist = captionsApiReady ? getCaptionTracklist() : [];
                       notifyCaptionsState();
                       applyPendingCaptions();
                   } catch(e) {}
               }
               function setSubtitlesEnabled(enabled, languageCode) {
                   try {
                       if (enabled) {
                           pendingCaptionEnable = true;
                           pendingCaptionLanguageCode = languageCode || null;
                           player.loadModule("captions");
                           applyPendingCaptions();
                       } else {
                           pendingCaptionEnable = false;
                           pendingCaptionLanguageCode = null;
                           try {
                               player.setOption("captions", "track", {});
                           } catch (ignored) {}
                           player.unloadModule("captions");
                       }
                   } catch(e) {}
               }
               function pollPosition() {
                   if (window.YoutubeProxy !== undefined) {
                       YoutubeProxy.onPlayerNotifyCurrentPosition(player.getCurrentTime());
                       YoutubeProxy.onPlayerNotifyBufferedPosition(player.getVideoLoadedFraction());
                   }
               }
               window.onresize = function() {
                   player.setSize(window.innerWidth, window.innerHeight);
                   playVideo();
               }
            </script>
    </body>
</html>
